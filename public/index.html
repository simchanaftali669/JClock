	(function redirectNeedMeDomain() {
		const hostname = window.location.hostname.toLowerCase().replace(/^www\./, "");
		const needMePath = "https://JClock.net/HebrewCommercial13/public/Need-Me/index.html";
		const needMeIframePath = "https://JClock.net/HebrewCommercial13/public/Need-Me/iframe.html";
		const coinDomain = "world-coin.ai";
		const isNeedMeDomain = hostname === "need-me.net";
		const isCoinDomain = hostname === coinDomain;
		const isCoinUrl = window.location.href.toLowerCase().includes("coin");

		function wantsIframe() {
			const params = new URLSearchParams(window.location.search);
			const path = window.location.pathname.toLowerCase();
			return path.includes("iframe") || path.includes("embed") || params.get("iframe") === "1" || params.get("embed") === "1";
		}

		function buildNeedMeUrl(forceEnglish, useIframe) {
			const params = new URLSearchParams(window.location.search);

			if (forceEnglish) {
				params.set("lang", "en");
			}

			const query = params.toString() ? "?" + params.toString() : "";
			return (useIframe ? needMeIframePath : needMePath) + query + window.location.hash;
		}

		function buildNeedMeDomainUrl() {
			const params = new URLSearchParams(window.location.search);
			params.set("lang", "en");

			const query = params.toString() ? "?" + params.toString() : "";
			return "https://Need-Me.net/" + (wantsIframe() ? "iframe.html" : "") + query + window.location.hash;
		}

		if (isCoinDomain || (!isNeedMeDomain && isCoinUrl)) {
			window.location.replace(buildNeedMeDomainUrl());
			return;
		}

		if (isNeedMeDomain) {
			window.location.replace(buildNeedMeUrl(false, wantsIframe()));
		}
	})();

		const hashValue = window.location.hash.substring(1);

		return "#" + continent.shortcut;
	}

	function findContinentByShortcut(hashValue) {
		const shortcutMatch = hashValue.replace(/^#/, "").match(/^(\d{2})(?:[\/_-]?[a-z]{2,3}(?:-[a-z]{2,8})?)?(?:\/.*)?$/i);
		const shortcut = shortcutMatch ? shortcutMatch[1] : hashValue.split("/")[0].replace(/^#/, "").toLowerCase();
		return continents.find(function(continent) {
			return continent.shortcut === shortcut;
		});
	}

	function setContinentShortcutHash() {
		const continent = getSelectedContinent();
		if (window.location.hash !== getContinentShortcutHash(continent)) {
			history.replaceState(null, "", getContinentShortcutHash(continent));
		}
	}

	function applyContinentShortcut(hashValue) {
		const continent = findContinentByShortcut(hashValue);
		if (!continent)
			return false;

		selectedContinentId = continent.id;
		return true;
	}

	function shouldShowOption(option) {
		const continent = getSelectedContinent();
		return option.clockMode === "all" || continent.clockMode === "all" || option.clockMode === continent.clockMode;
	}

	function applyLanguage() {
		document.documentElement.lang = language;
		document.documentElement.dir = language === "he" ? "rtl" : "ltr";
		subtitle.textContent = text[language].subtitle;
	}

	function updateFrameScale() {
		const scale = Math.min(1, window.innerWidth / MOBILE_FRAME_WIDTH);
		document.documentElement.style.setProperty("--frame-scale", scale);
		updateSlotScales();
	}

	function updateSlotScales() {
		iframeContainer.querySelectorAll(".frame-slot").forEach(function(slot) {
			const slotWidth = slot.getBoundingClientRect().width || window.innerWidth;
			const scale = Math.min(1, slotWidth / MOBILE_FRAME_WIDTH);
			slot.classList.toggle("narrow-slot", scale < 1);
			slot.style.setProperty("--frame-scale", scale);
		});
	}

	function watchFrameSlots() {
		if (frameResizeObserver) {
			frameResizeObserver.disconnect();
			frameResizeObserver = null;
		}

		if ("ResizeObserver" in window) {
			frameResizeObserver = new ResizeObserver(updateSlotScales);
			iframeContainer.querySelectorAll(".frame-slot").forEach(function(slot) {
				frameResizeObserver.observe(slot);
			});
		}

		requestAnimationFrame(updateSlotScales);
	}

	function renderContinentFilter() {
		continentButtons.innerHTML = "";

		continents.forEach(function(continent) {
			const button = document.createElement("button");
			button.type = "button";
			button.className = "continent-button";
			button.textContent = continent.shortcut + " - " + localText(continent.label);
			button.setAttribute("aria-pressed", continent.id === selectedContinentId ? "true" : "false");
			if (continent.id === selectedContinentId) {
				button.classList.add("active");
			}
			button.onclick = function() {
				selectContinent(continent.id);
			};
			continentButtons.appendChild(button);
		});
	}

	function selectContinent(continentId) {
		selectedContinentId = continentId;
		setContinentShortcutHash();
		renderContinentFilter();
		renderChoices();
	}

	function getVisibleChoiceItems() {
		return viewOptions.filter(function(option) {
			return option.learningShortcut && shouldShowOption(option);
		});
	}

	function renderChoices() {
		choiceGrid.innerHTML = "";

		getVisibleChoiceItems().forEach(function(option) {
			if (option.heading) {
				const heading = document.createElement("h2");
				heading.className = "choice-section-title";
				heading.textContent = localText(option.heading);
				choiceGrid.appendChild(heading);
				return;
			}

			if (option.personalUrl) {
				const split = document.createElement("div");
				const personalButton = document.createElement("button");
				const mainButton = document.createElement("button");

				split.className = "choice-split";
				split.setAttribute("role", "group");
				split.setAttribute("aria-label", localText(option.label));

				personalButton.type = "button";
				personalButton.className = "choice-button choice-personal";
				personalButton.textContent = localText(option.personalLabel);
				personalButton.dir = language === "he" ? "rtl" : "ltr";
				personalButton.onclick = function() {
					window.location.href = option.personalUrl;
				};

				mainButton.type = "button";
				mainButton.className = "choice-button choice-main";
				mainButton.textContent = localText(option.label);
				mainButton.dir = language === "he" ? "rtl" : "ltr";
				mainButton.onclick = function() {
					openView(option.id);
				};

				split.appendChild(mainButton);
				split.appendChild(personalButton);
				choiceGrid.appendChild(split);
				return;
			}

			if (option.learningShortcut) {
				const split = document.createElement("div");
				const label = document.createElement("div");
				const clockButton = document.createElement("button");
				const learningButton = document.createElement("button");

				split.className = "learning-split";
				split.setAttribute("role", "group");
				split.setAttribute("aria-label", localText(option.label));

				label.className = "learning-split-label";
				label.textContent = localText(option.label);

				clockButton.type = "button";
				clockButton.className = "learning-half learning-half-man";
				clockButton.textContent = language === "he" ? "שעון" : "Clock";
				clockButton.onclick = function() {
					openContinentClock();
				};

				learningButton.type = "button";
				learningButton.className = "learning-half learning-half-woman";
				learningButton.textContent = localText(option.label);
				learningButton.onclick = function() {
					openLearningChoice();
				};

				split.appendChild(clockButton);
				split.appendChild(learningButton);
				split.appendChild(label);
				choiceGrid.appendChild(split);
				return;
			}

			const button = document.createElement("button");
			button.type = "button";
			button.className = "choice-button" + (option.primary ? " primary" : "") + (option.yellow ? " learning-books" : "");
			button.textContent = localText(option.label);
			button.onclick = function() {
				openView(option.id);
			};
			choiceGrid.appendChild(button);
		});
	}

	function navigateToFrame(frame) {
		window.location.href = frame.src;
	}

	function buildLearningUrl(isWoman) {
		const learningPath = isWoman ? sourcePaths.learningWoman : sourcePaths.learningMan;
		return learningPath + language + "/index.html" + locationQuery;
	}

	function openLearningShortcut(forceWoman) {
		const continent = getSelectedContinent();
		const isWoman = forceWoman || continent.clockMode === "moon";
		window.location.href = buildLearningUrl(isWoman);
	}

	function openLearningChoice() {
		const continent = getSelectedContinent();

		if (continent.clockMode !== "mixed") {
			openLearningShortcut(false);
			return;
		}

		renderLearningGenderChoice();
	}

	function renderLearningGenderChoice() {
		choiceGrid.innerHTML = "";

		const genderChoice = document.createElement("div");
		const womanButton = document.createElement("button");
		const manButton = document.createElement("button");

		genderChoice.className = "gender-choice";
		genderChoice.setAttribute("role", "group");
		genderChoice.setAttribute("aria-label", language === "he" ? "בחירת נשים או גברים" : "Choose women or men");

		womanButton.type = "button";
		womanButton.className = "choice-button gender-choice-woman";
		womanButton.textContent = language === "he" ? "נשים" : "Woman";
		womanButton.onclick = function() {
			openLearningShortcut(true);
		};

		manButton.type = "button";
		manButton.className = "choice-button gender-choice-man";
		manButton.textContent = language === "he" ? "גברים" : "Man";
		manButton.onclick = function() {
			window.location.href = buildLearningUrl(false);
		};

		genderChoice.appendChild(womanButton);
		genderChoice.appendChild(manButton);
		choiceGrid.appendChild(genderChoice);
	}

	function getContinentClockOptionId() {
		const continent = getSelectedContinent();

		if (continent.clockMode === "moon")
			return "moon-clock";

		if (continent.clockMode === "mixed")
			return "diaspora-clock-ads";

		return "sun-clock";
	}

	function openContinentClock() {
		openView(getContinentClockOptionId());
	}

	function openHashShortcut(hashValue) {
		const shortcut = hashValue.split("/")[0].toLowerCase();

		if (shortcut === "bilig_limud") {
			openLearningChoice();
			return true;
		}

		if (shortcut === "bilig_glimud") {
			openLearningShortcut(true);
			return true;
		}

		return false;
	}

	function openView(optionId) {
		if (openHashShortcut(optionId))
			return;

		const cleanOptionId = optionId.split("/")[0];
		const option = viewOptions.find(function(item) {
			return item.id === cleanOptionId;
		}) || viewOptions.find(function(item) {
			return item.id;
		});

		if (!option.frames) {
			choiceScreen.style.display = "";
			viewer.style.display = "none";
			window.location.hash = "";
			return;
		}

		if (option.frames.length === 1) {
			navigateToFrame(option.frames[0]);
			return;
		}

		openFrames(option.id, option.frames, option.layout);
	}

	function openFrames(optionId, frames, layout) {
		iframeContainer.innerHTML = "";
		iframeContainer.className = layout === "quad" ? "quad-layout" : (layout === "row" ? "row-layout" : (layout === "clock-ads" ? "clock-ads-layout" : ""));

		frames.forEach(function(frame) {
			const frameSlot = document.createElement("div");
			const iframe = document.createElement("iframe");
			frameSlot.className = "frame-slot";
			iframe.className = "display-frame";
			iframe.title = localText(frame.title);
			iframe.src = frame.src;
			iframe.tabIndex = 0;
			iframe.setAttribute("scrolling", "auto");
			iframe.addEventListener("mouseenter", function() {
				iframe.focus();
			});
			iframe.addEventListener("click", function() {
				iframe.focus();
			});
			frameSlot.appendChild(iframe);
			iframeContainer.appendChild(frameSlot);
		});

		choiceScreen.style.display = "none";
		viewer.style.display = "flex";
		window.location.hash = optionId + "/" + frames.map(function(frame) {
			return frame.src;
		}).join("|");
		watchFrameSlots();
	}

	applyLanguage();
	updateFrameScale();

	if (window.location.hash.length > 1) {
		applyContinentShortcut(window.location.hash.substring(1));
	} else {
		setContinentShortcutHash();
	}

	renderContinentFilter();
	renderChoices();
	window.addEventListener("resize", updateFrameScale);

	if (window.location.hash.length > 1) {
		const hashValue = window.location.hash.substring(1);
		if (!findContinentByShortcut(hashValue)) {
			openView(hashValue);
		}
	}
</script>
</body>
</html>
