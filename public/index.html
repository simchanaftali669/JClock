<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
	<!-- Global site tag (gtag.js) - Google Analytics -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=UA-30684949-2"></script>
	<script>
	  window.dataLayer = window.dataLayer || [];
	  function gtag(){dataLayer.push(arguments);}

	  gtag('config', 'UA-30684949-2');

    <script data-ad-client="ca-pub-1007867022366730" async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js">
    </script>
    <title>JClock</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jerusalem Universal HebrewClock">
    <meta name="keywords" content="">
    <meta name="author" content="simchanaftali Bilig">
	<style>
		html,
		body {
			min-height: 100%;
			margin: 0;
			overflow-x: hidden;
			overflow-y: auto;
			font-family: Arial, Helvetica, sans-serif;
			background: #f4f7f1;
			color: #172018;
		}

		body {
			min-height: 100%;
		}

		#choice-screen {
			box-sizing: border-box;
			min-height: 100vh;
			padding: 28px 18px;
			overflow: auto;
			background:
				linear-gradient(135deg, rgba(255,255,255,0.94), rgba(244,247,241,0.9)),
				url("HebrewClock13/wix_media/Kotel.jpg") center/cover no-repeat;
		}

		.choice-inner {
			width: min(980px, 100%);
			margin: 0 auto;
		}

		h1 {
			margin: 0 0 8px;
			font-size: clamp(30px, 5vw, 52px);
			font-weight: 800;
			letter-spacing: 0;
		}

		.subtitle {
			margin: 0 0 22px;
			font-size: clamp(17px, 2.6vw, 23px);
			line-height: 1.45;
		}

		.choice-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
			gap: 12px;
		}

		.choice-button {
			min-height: 82px;
			padding: 16px 18px;
			border: 2px solid #204b31;
			border-radius: 8px;
			background: rgba(255, 255, 255, 0.94);
			color: #17311f;
			font-size: 20px;
			font-weight: 700;
			line-height: 1.28;
			text-align: start;
			cursor: pointer;
			box-shadow: 0 6px 16px rgba(20, 45, 25, 0.12);
		}

		.choice-button:hover,
		.choice-button:focus {
			background: #e9f3e7;
			outline: 3px solid rgba(32, 75, 49, 0.18);
		}

		.choice-button.primary {
			background: #204b31;
			color: #fff;
		}

		#viewer {
			display: none;
			position: relative;
			flex-direction: column;
			min-height: 100vh;
			background: #fff;
		}

		#iframe-container {
			display: flex;
			flex: 1;
			flex-direction: column;
			min-height: 0;
		}

		#iframe-container.quad-layout {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			grid-template-rows: repeat(2, minmax(0, 1fr));
			background: #111;
			gap: 2px;
		}

		.frame-slot {
			flex: 1 1 0;
			width: 100%;
			min-height: 0;
			overflow: hidden;
		}

		.display-frame {
			width: 100%;
			height: 100%;
			border: 0;
			background: #fff;
		}

		#iframe-container.quad-layout .frame-slot {
			position: relative;
			background: #fff;
		}

		#iframe-container.quad-layout .frame-slot.narrow-slot .display-frame {
			position: absolute;
			top: 0;
			left: 50%;
			width: 900px;
			height: calc(100% / var(--frame-scale, 1));
			transform: translateX(-50%) scale(var(--frame-scale, 1));
			transform-origin: top center;
		}

		@media (max-width: 900px) {
			#choice-screen {
				padding: 18px 12px;
			}

			.choice-grid {
				grid-template-columns: 1fr;
			}

			.choice-button {
				min-height: 66px;
				font-size: 18px;
			}

			.frame-slot {
				position: relative;
			}

			.display-frame {
				position: absolute;
				top: 0;
				left: 50%;
				width: 900px;
				height: calc(100% / var(--frame-scale, 1));
				transform: translateX(-50%) scale(var(--frame-scale, 1));
				transform-origin: top center;
			}
		}

		@media (max-aspect-ratio: 1/1) {
			#iframe-container.quad-layout {
				grid-template-columns: 1fr;
				grid-template-rows: repeat(4, minmax(0, 1fr));
			}
		}
	</style>
</head>

<body id="youtube">
	<main id="choice-screen">
		<div class="choice-inner">
			<h1>JClock</h1>
			<p class="subtitle" id="subtitle"></p>

			<div class="choice-grid" id="choice-grid"></div>
		</div>
	</main>

	<section id="viewer" aria-live="polite">
		<div id="iframe-container"></div>
	</section>

<script type="text/javascript">
	const DEFAULT_LATITUDE = "31.7768514";
	const DEFAULT_LONGITUDE = "35.2331664";
	const locationQuery = "?latitude=" + DEFAULT_LATITUDE + "&longitude=" + DEFAULT_LONGITUDE;
	const userLanguage = (navigator.language || navigator.userLanguage || "he").toLowerCase();
	const language = userLanguage.startsWith("en") ? "en" : "he";
	const MOBILE_FRAME_WIDTH = 900;

	const text = {
		he: {
			subtitle: "בחר את התצוגה שתרצה לפתוח"
		},
		en: {
			subtitle: "Choose the display you want to open"
		}
	};

	const sources = {
		clockFamily: "HebrewClock13/public/family/index.html" + locationQuery,
		clockMan: "HebrewClock13/public/man/simple/index.html" + locationQuery,
		clockWoman: "HebrewClock13/public/woman/simple/index.html" + locationQuery,
		commercialFamily: "HebrewCommercial13/public/family/index.html" + locationQuery,
		commercialMan: "HebrewCommercial13/public/man/index.html" + locationQuery,
		commercialWoman: "HebrewCommercial13/public/woman/index.html" + locationQuery
	};

	const viewOptions = [
		{
			id: "all",
			label: {
				he: "המצב הרגיל - כל 4 התצוגות",
				en: "Regular mode - all 4 displays"
			},
			layout: "quad",
			frames: [
				{ title: { he: "פרסומות לגברים", en: "Ads for men" }, src: sources.commercialMan },
				{ title: { he: "פרסומות לנשים", en: "Ads for women" }, src: sources.commercialWoman },
				{ title: { he: "שעון עברי לגברים", en: "Hebrew clock for men" }, src: sources.clockMan + "&compact=1" },
				{ title: { he: "שעון עברי לנשים", en: "Hebrew clock for women" }, src: sources.clockWoman + "&compact=1" }
			],
			primary: true
		},
		{
			id: "clock-commercial-men",
			label: {
				he: "שעון עברי + פרסומות לגברים",
				en: "Hebrew clock + ads for men"
			},
			frames: [
				{ title: { he: "פרסומות לגברים", en: "Ads for men" }, src: sources.commercialMan },
				{ title: { he: "שעון עברי לגברים", en: "Hebrew clock for men" }, src: sources.clockMan }
			]
		},
		{
			id: "clock-commercial-women",
			label: {
				he: "שעון עברי + פרסומות לנשים",
				en: "Hebrew clock + ads for women"
			},
			frames: [
				{ title: { he: "פרסומות לנשים", en: "Ads for women" }, src: sources.commercialWoman },
				{ title: { he: "שעון עברי לנשים", en: "Hebrew clock for women" }, src: sources.clockWoman }
			]
		},
		{
			id: "clock-commercial-family",
			label: {
				he: "שעון עברי + פרסומות לגברים ונשים",
				en: "Hebrew clock + ads for men and women"
			},
			frames: [
				{ title: { he: "פרסומות לגברים ונשים", en: "Ads for men and women" }, src: sources.commercialFamily },
				{ title: { he: "שעון עברי לגברים ונשים", en: "Hebrew clock for men and women" }, src: sources.clockFamily }
			]
		},
		{
			id: "clock-family",
			label: {
				he: "שעון עברי לגברים ונשים",
				en: "Hebrew clock for men and women"
			},
			frames: [
				{ title: { he: "שעון עברי לגברים ונשים", en: "Hebrew clock for men and women" }, src: sources.clockFamily }
			]
		},
		{
			id: "commercial-family",
			label: {
				he: "פרסומות לגברים ונשים",
				en: "Ads for men and women"
			},
			frames: [
				{ title: { he: "פרסומות לגברים ונשים", en: "Ads for men and women" }, src: sources.commercialFamily }
			]
		},
		{
			id: "clock-men",
			label: {
				he: "שעון עברי לגברים",
				en: "Hebrew clock for men"
			},
			frames: [
				{ title: { he: "שעון עברי לגברים", en: "Hebrew clock for men" }, src: sources.clockMan }
			]
		},
		{
			id: "clock-women",
			label: {
				he: "שעון עברי לנשים",
				en: "Hebrew clock for women"
			},
			frames: [
				{ title: { he: "שעון עברי לנשים", en: "Hebrew clock for women" }, src: sources.clockWoman }
			]
		},
		{
			id: "commercial-women",
			label: {
				he: "פרסומות לנשים",
				en: "Ads for women"
			},
			frames: [
				{ title: { he: "פרסומות לנשים", en: "Ads for women" }, src: sources.commercialWoman }
			]
		},
		{
			id: "commercial-men",
			label: {
				he: "פרסומות לגברים",
				en: "Ads for men"
			},
			frames: [
				{ title: { he: "פרסומות לגברים", en: "Ads for men" }, src: sources.commercialMan }
			]
		}
	];

	const choiceScreen = document.getElementById("choice-screen");
	const subtitle = document.getElementById("subtitle");
	const choiceGrid = document.getElementById("choice-grid");
	const viewer = document.getElementById("viewer");
	const iframeContainer = document.getElementById("iframe-container");
	let frameResizeObserver = null;

	function localText(value) {
		return value[language] || value.he;
	}

	function applyLanguage() {
		document.documentElement.lang = language;
		document.documentElement.dir = language === "he" ? "rtl" : "ltr";
		subtitle.textContent = text[language].subtitle;
	}

	function updateFrameScale() {
		const scale = Math.min(1, window.innerWidth / MOBILE_FRAME_WIDTH);
		document.documentElement.style.setProperty("--frame-scale", scale);
		updateSlotScales();
	}

	function updateSlotScales() {
		iframeContainer.querySelectorAll(".frame-slot").forEach(function(slot) {
			const slotWidth = slot.getBoundingClientRect().width || window.innerWidth;
			const scale = Math.min(1, slotWidth / MOBILE_FRAME_WIDTH);
			slot.classList.toggle("narrow-slot", scale < 1);
			slot.style.setProperty("--frame-scale", scale);
		});
	}

	function watchFrameSlots() {
		if (frameResizeObserver) {
			frameResizeObserver.disconnect();
			frameResizeObserver = null;
		}

		if ("ResizeObserver" in window) {
			frameResizeObserver = new ResizeObserver(updateSlotScales);
			iframeContainer.querySelectorAll(".frame-slot").forEach(function(slot) {
				frameResizeObserver.observe(slot);
			});
		}

		requestAnimationFrame(updateSlotScales);
	}

	function renderChoices() {
		viewOptions.forEach(function(option) {
			const button = document.createElement("button");
			button.type = "button";
			button.className = "choice-button" + (option.primary ? " primary" : "");
			button.textContent = localText(option.label);
			button.onclick = function() {
				openView(option.id);
			};
			choiceGrid.appendChild(button);
		});
	}

	function openView(optionId) {
		const cleanOptionId = optionId.split("/")[0];
		const option = viewOptions.find(function(item) {
			return item.id === cleanOptionId;
		}) || viewOptions[0];

		iframeContainer.innerHTML = "";
		iframeContainer.className = option.layout === "quad" ? "quad-layout" : "";

		option.frames.forEach(function(frame) {
			const frameSlot = document.createElement("div");
			const iframe = document.createElement("iframe");
			frameSlot.className = "frame-slot";
			iframe.className = "display-frame";
			iframe.title = localText(frame.title);
			iframe.src = frame.src;
			iframe.allow = "geolocation";
			iframe.tabIndex = 0;
			iframe.setAttribute("scrolling", "auto");
			iframe.addEventListener("mouseenter", function() {
				iframe.focus();
			});
			iframe.addEventListener("click", function() {
				iframe.focus();
			});
			frameSlot.appendChild(iframe);
			iframeContainer.appendChild(frameSlot);
		});

		choiceScreen.style.display = "none";
		viewer.style.display = "flex";
		window.location.hash = option.id + "/" + option.frames.map(function(frame) {
			return frame.src;
		}).join("|");
		watchFrameSlots();
	}

	applyLanguage();
	updateFrameScale();
	renderChoices();
	window.addEventListener("resize", updateFrameScale);

	if (window.location.hash.length > 1) {
		openView(window.location.hash.substring(1));
	}
</script>
</body>
</html>
