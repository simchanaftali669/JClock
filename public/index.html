			padding: 8px 12px;

			border-radius: 8px;

			font-size: 18px;
			font-weight: 700;

			cursor: pointer;

			background: #e9f3e7;
			outline: 3px solid rgba(32, 75, 49, 0.18);
		}

			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
			gap: 12px;
		}

		.choice-section-title {
			grid-column: 1 / -1;

			background: #e9f3e7;

		.choice-button.primary {

			color: #fff;
		}

		.choice-split {
			position: relative;
			min-height: 82px;
			border: 2px solid #204b31;
			border-radius: 8px;

			box-shadow: 0 6px 16px rgba(20, 45, 25, 0.12);

			min-height: 82px;
			border: 0;
			border-radius: 0;
			box-shadow: none;
		}

		.choice-split .choice-main {
			position: relative;
			z-index: 1;
			width: 100%;
			height: 100%;
			background: transparent;
		}

		.choice-split .choice-personal {
			position: absolute;
			z-index: 2;
			top: 0;
			left: 0;
			width: 50%;
			height: 100%;
			min-height: 0;
			padding: 0;
			background: rgba(255, 243, 163, 0.64);
			color: transparent;
			font-size: 0;
		}

		.choice-split .choice-personal:hover,
		.choice-split .choice-personal:focus {
			background: rgba(255, 232, 121, 0.9);
			outline: 3px solid rgba(32, 75, 49, 0.18);
		}

		#viewer {
			display: none;
			position: relative;
			flex-direction: column;
			height: 100vh;
			min-height: 0;
			background: #fff;
			overflow: hidden;
		}

		#iframe-container {
			display: flex;
			flex: 1;
			flex-direction: column;
			height: 100%;
			min-height: 0;
		}

		}

			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			grid-template-rows: repeat(2, minmax(0, 1fr));
			background: #111;
			gap: 2px;
		}

		.frame-slot {
			flex: 1 1 0;
			width: 100%;
			min-height: 0;
			overflow: hidden;
			position: relative;
		}

		.display-frame {
			width: 100%;
			height: 100%;
			border: 0;
			background: #fff;
		}

		#iframe-container.quad-layout .frame-slot {
			background: #fff;
		}

		#iframe-container.quad-layout .frame-slot.narrow-slot .display-frame,
		#iframe-container.row-layout .frame-slot.narrow-slot .display-frame {

			top: 0;
			left: 50%;

			height: calc(100% / var(--frame-scale, 1));
			transform: translateX(-50%) scale(var(--frame-scale, 1));
			transform-origin: top center;

			#iframe-container.quad-layout {

				grid-template-rows: repeat(4, minmax(0, 1fr));

	(function redirectNeedMeDomain() {
		const hostname = window.location.hostname.toLowerCase().replace(/^www\./, "");
		const needMePath = "https://JClock.net/HebrewCommercial13/public/Need-Me/index.html";
		const needMeIframePath = "https://JClock.net/HebrewCommercial13/public/Need-Me/iframe.html";
		const coinDomain = "world-coin.ai";
		const isNeedMeDomain = hostname === "need-me.net";
		const isCoinDomain = hostname === coinDomain;
		const isCoinUrl = window.location.href.toLowerCase().includes("coin");

		function wantsIframe() {
			const params = new URLSearchParams(window.location.search);
			const path = window.location.pathname.toLowerCase();
			return path.includes("iframe") || path.includes("embed") || params.get("iframe") === "1" || params.get("embed") === "1";
		}

		function buildNeedMeUrl(forceEnglish, useIframe) {
			const params = new URLSearchParams(window.location.search);

			if (forceEnglish) {
				params.set("lang", "en");
			}

			const query = params.toString() ? "?" + params.toString() : "";
			return (useIframe ? needMeIframePath : needMePath) + query + window.location.hash;
		}

		function buildNeedMeDomainUrl() {
			const params = new URLSearchParams(window.location.search);
			params.set("lang", "en");

			const query = params.toString() ? "?" + params.toString() : "";
			return "https://Need-Me.net/" + (wantsIframe() ? "iframe.html" : "") + query + window.location.hash;
		}

		if (isCoinDomain || (!isNeedMeDomain && isCoinUrl)) {
			window.location.replace(buildNeedMeDomainUrl());
			return;
		}

		if (isNeedMeDomain) {
			window.location.replace(buildNeedMeUrl(false, wantsIframe()));
		}
	})();

	const sourcePaths = {

			},
			frames: [

			},
			frames: [
				{ title: { he: "פרסומות של שעון חמה", en: "Sun clock ads" }, src: sources.commercialMan },
				{ title: { he: "שעון חמה", en: "Sun clock" }, src: sources.clockMan }
			],

		},

			id: "moon-clock-ads",
			label: {

				en: "Moon clock + ads"
			},
			frames: [
				{ title: { he: "פרסומות של שעון לבנה", en: "Moon clock ads" }, src: sources.commercialWoman },
				{ title: { he: "שעון לבנה", en: "Moon clock" }, src: sources.clockWoman }
			],
			layout: "clock-ads",
			clockMode: "moon"
		},
		{

			label: {
				he: "שעון חו\"ל (חמה ולבנה) + פרסומות",
				en: "Diaspora clock (Sun and Moon) + ads"
			},
			personalLabel: {
				he: "",
				en: ""
			},
			personalUrl: sourcePaths.personalArea + language + "/index.html" + locationQuery,
			frames: [
				{ title: { he: "פרסומות של שעון חו\"ל", en: "Diaspora clock ads" }, src: sources.commercialFamily },
				{ title: { he: "שעון חו\"ל (חמה ולבנה)", en: "Diaspora clock (Sun and Moon)" }, src: sources.clockFamily }
			],
			layout: "clock-ads",
			clockMode: "mixed"
		}
	];

	const choiceScreen = document.getElementById("choice-screen");
	const subtitle = document.getElementById("subtitle");
	const continentFilter = document.getElementById("continent-filter");
	const choiceGrid = document.getElementById("choice-grid");
	const viewer = document.getElementById("viewer");
	const iframeContainer = document.getElementById("iframe-container");
	let frameResizeObserver = null;
	let selectedContinentId = "north-america";

	function localText(value) {
		return value[language] || value.he;
	}

	function getSelectedContinent() {
		return continents.find(function(continent) {
			return continent.id === selectedContinentId;
		}) || continents[0];
	}

	function shouldShowOption(option) {
		const continent = getSelectedContinent();
		return continent.clockMode === "all" || option.clockMode === continent.clockMode;
	}

	function applyLanguage() {
		document.documentElement.lang = language;
		document.documentElement.dir = language === "he" ? "rtl" : "ltr";
		subtitle.textContent = text[language].subtitle;
	}

	function updateFrameScale() {
		const scale = Math.min(1, window.innerWidth / MOBILE_FRAME_WIDTH);
		document.documentElement.style.setProperty("--frame-scale", scale);
		updateSlotScales();
	}

	function updateSlotScales() {
		iframeContainer.querySelectorAll(".frame-slot").forEach(function(slot) {
			const slotWidth = slot.getBoundingClientRect().width || window.innerWidth;
			const scale = Math.min(1, slotWidth / MOBILE_FRAME_WIDTH);
			slot.classList.toggle("narrow-slot", scale < 1);
			slot.style.setProperty("--frame-scale", scale);
		});
	}

	function watchFrameSlots() {
		if (frameResizeObserver) {
			frameResizeObserver.disconnect();
			frameResizeObserver = null;
		}

		if ("ResizeObserver" in window) {
			frameResizeObserver = new ResizeObserver(updateSlotScales);
			iframeContainer.querySelectorAll(".frame-slot").forEach(function(slot) {
				frameResizeObserver.observe(slot);
			});
		}

		requestAnimationFrame(updateSlotScales);
	}

	function renderContinentFilter() {
		continentFilter.innerHTML = "";

		continents.forEach(function(continent) {
			const option = document.createElement("option");
			option.value = continent.id;
			option.textContent = localText(continent.label);
			continentFilter.appendChild(option);
		});

		continentFilter.value = selectedContinentId;
		continentFilter.onchange = function() {
			selectedContinentId = continentFilter.value;
			renderChoices();
		};
	}

	function getVisibleChoiceItems() {
		const visibleItems = [];
		let pendingHeading = null;

		viewOptions.forEach(function(option) {
			if (option.heading) {
				pendingHeading = option;
				return;
			}

			if (shouldShowOption(option)) {
				if (pendingHeading) {
					visibleItems.push(pendingHeading);
					pendingHeading = null;
				}

				visibleItems.push(option);
			}
		});

		return visibleItems;
	}

	function renderChoices() {
		choiceGrid.innerHTML = "";

		getVisibleChoiceItems().forEach(function(option) {
			if (option.heading) {
				const heading = document.createElement("h2");
				heading.className = "choice-section-title";
				heading.textContent = localText(option.heading);
				choiceGrid.appendChild(heading);
				return;
			}

			if (option.personalUrl) {
				const split = document.createElement("div");
				const personalButton = document.createElement("button");
				const mainButton = document.createElement("button");

				split.className = "choice-split";
				split.setAttribute("role", "group");
				split.setAttribute("aria-label", localText(option.label));

				personalButton.type = "button";
				personalButton.className = "choice-button choice-personal";
				personalButton.textContent = localText(option.personalLabel);
				personalButton.dir = language === "he" ? "rtl" : "ltr";
				personalButton.onclick = function() {
					window.location.href = option.personalUrl;
				};

				mainButton.type = "button";
				mainButton.className = "choice-button choice-main";
				mainButton.textContent = localText(option.label);
				mainButton.dir = language === "he" ? "rtl" : "ltr";
				mainButton.onclick = function() {
					openView(option.id);
				};

				split.appendChild(mainButton);
				split.appendChild(personalButton);
				choiceGrid.appendChild(split);
				return;
			}

			const button = document.createElement("button");
			button.type = "button";
			button.className = "choice-button" + (option.primary ? " primary" : "");
			button.textContent = localText(option.label);
			button.onclick = function() {
				openView(option.id);
			};
			choiceGrid.appendChild(button);
		});
	}

	function openView(optionId) {
		const cleanOptionId = optionId.split("/")[0];
		const option = viewOptions.find(function(item) {
			return item.id === cleanOptionId;
		}) || viewOptions.find(function(item) {
			return item.id;
		});

		if (!option.frames) {
			choiceScreen.style.display = "";
			viewer.style.display = "none";
			window.location.hash = "";
			return;
		}

		openFrames(option.id, option.frames, option.layout);
	}

	function openFrames(optionId, frames, layout) {
		iframeContainer.innerHTML = "";
		iframeContainer.className = layout === "quad" ? "quad-layout" : (layout === "row" ? "row-layout" : (layout === "clock-ads" ? "clock-ads-layout" : ""));

		frames.forEach(function(frame) {
			const frameSlot = document.createElement("div");
			const iframe = document.createElement("iframe");
			frameSlot.className = "frame-slot";
			iframe.className = "display-frame";
			iframe.title = localText(frame.title);
			iframe.src = frame.src;
			iframe.tabIndex = 0;
			iframe.setAttribute("scrolling", "auto");
			iframe.addEventListener("mouseenter", function() {
				iframe.focus();
			});
			iframe.addEventListener("click", function() {
				iframe.focus();
			});
			frameSlot.appendChild(iframe);
			iframeContainer.appendChild(frameSlot);
		});

		choiceScreen.style.display = "none";
		viewer.style.display = "flex";
		window.location.hash = optionId + "/" + frames.map(function(frame) {
			return frame.src;
		}).join("|");
		watchFrameSlots();
	}

	applyLanguage();
	updateFrameScale();
	renderContinentFilter();
	renderChoices();
	window.addEventListener("resize", updateFrameScale);

	if (window.location.hash.length > 1) {
		openView(window.location.hash.substring(1));
	}
</script>
</body>
</html>
