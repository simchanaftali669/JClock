<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
	<!-- Global site tag (gtag.js) - Google Analytics -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=UA-30684949-2"></script>
	<script>

    <script data-ad-client="ca-pub-1007867022366730" async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js">
    </script>
    <title>JClock</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jerusalem Universal HebrewClock">
    <meta name="keywords" content="">
    <meta name="author" content="simchanaftali Bilig">
	<style>
		html,
		body {
			min-height: 100%;
			margin: 0;
			overflow-x: hidden;
			overflow-y: auto;
			font-family: Arial, Helvetica, sans-serif;
			background: #f4f7f1;
			color: #172018;
		}

		body {
			min-height: 100%;
		}

		#choice-screen {
			box-sizing: border-box;
			min-height: 100vh;
			padding: 28px 18px;
			overflow: auto;
			background:
				linear-gradient(135deg, rgba(255,255,255,0.94), rgba(244,247,241,0.9)),
				url("https://JClock.net/HebrewClock13/wix_media/Kotel.jpg") center/cover no-repeat;
		}

		.choice-inner {
			width: min(980px, 100%);
			margin: 0 auto;
		}

		h1 {
			margin: 0 0 8px;
			font-size: clamp(30px, 5vw, 52px);
			font-weight: 800;
			letter-spacing: 0;
		}

		.subtitle {
			margin: 0 0 22px;
			font-size: clamp(17px, 2.6vw, 23px);
			line-height: 1.45;
		}

		.choice-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
			gap: 12px;
		}

		.choice-section-title {
			grid-column: 1 / -1;
			margin: 12px 0 0;
			font-size: 24px;
			font-weight: 800;
			line-height: 1.25;
			color: #17311f;
		}

		.choice-button {
			min-height: 82px;
			padding: 16px 18px;
			border: 2px solid #204b31;
			border-radius: 8px;
			background: rgba(255, 255, 255, 0.94);
			color: #17311f;
			font-size: 20px;
			font-weight: 700;
			line-height: 1.28;
			text-align: start;
			cursor: pointer;
			box-shadow: 0 6px 16px rgba(20, 45, 25, 0.12);
		}

		.choice-button:hover,
		.choice-button:focus {
			background: #e9f3e7;
			outline: 3px solid rgba(32, 75, 49, 0.18);
		}

		.choice-button.primary {
			background: #204b31;
			color: #fff;
		}

		.choice-split {
			display: grid;
			grid-template-columns: 1fr 1fr;
			min-height: 82px;
			border: 2px solid #204b31;
			border-radius: 8px;
			overflow: hidden;
			box-shadow: 0 6px 16px rgba(20, 45, 25, 0.12);
			direction: ltr;
		}

		.choice-split .choice-button {
			min-height: 78px;
			border: 0;
			border-radius: 0;
			box-shadow: none;
		}

		.choice-split .choice-button + .choice-button {
			border-left: 2px solid #204b31;
		}

		.choice-split .choice-main {
			direction: inherit;
		}

		.choice-split .choice-personal {
			background: #fff3a3;
			color: transparent;
			direction: inherit;
		}

		.choice-split .choice-personal:hover,
		.choice-split .choice-personal:focus {
			background: #ffe879;
		}

		#viewer {
			display: none;
			position: relative;
			flex-direction: column;
			height: 100vh;
			min-height: 0;
			background: #fff;
			overflow: hidden;
		}

		#iframe-container {
			display: flex;
			flex: 1;
			flex-direction: column;
			height: 100%;
			min-height: 0;
		}

		#iframe-container.row-layout {
			flex-direction: row;
		}

		#iframe-container.clock-ads-layout .frame-slot:first-child {
			flex: 0 0 42vh;
		}

		#iframe-container.clock-ads-layout .frame-slot:last-child {
			flex: 1 1 0;
		}

		#iframe-container.quad-layout {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			grid-template-rows: repeat(2, minmax(0, 1fr));
			background: #111;
			gap: 2px;
		}

		.frame-slot {
			flex: 1 1 0;
			width: 100%;
			min-height: 0;
			overflow: hidden;
			position: relative;
		}

		.display-frame {
			width: 100%;
			height: 100%;
			border: 0;
			background: #fff;
		}

		#iframe-container.quad-layout .frame-slot {
			background: #fff;
		}

		#iframe-container.quad-layout .frame-slot.narrow-slot .display-frame,
		#iframe-container.row-layout .frame-slot.narrow-slot .display-frame {
			position: absolute;
			top: 0;
			left: 50%;
			width: 900px;
			height: calc(100% / var(--frame-scale, 1));
			transform: translateX(-50%) scale(var(--frame-scale, 1));
			transform-origin: top center;
		}

		@media (max-width: 900px) {
			#choice-screen {
				padding: 18px 12px;
			}

			.choice-section-title {
				font-size: 21px;
			}

			.choice-grid {
				grid-template-columns: 1fr;
			}

			.choice-button {
				min-height: 66px;
				font-size: 18px;
			}

			.choice-split {
				min-height: 66px;
			}

			.choice-split .choice-button {
				min-height: 64px;
			}

			.frame-slot {
				position: relative;
			}

			.display-frame {
				position: absolute;
				top: 0;
				left: 50%;
				width: 900px;
				height: calc(100% / var(--frame-scale, 1));
				transform: translateX(-50%) scale(var(--frame-scale, 1));
				transform-origin: top center;
			}
		}

		@media (max-aspect-ratio: 1/1) {
			#iframe-container.quad-layout {
				grid-template-columns: 1fr;
				grid-template-rows: repeat(4, minmax(0, 1fr));
			}
		}
	</style>
</head>

<body id="youtube">
	<main id="choice-screen">
		<div class="choice-inner">
			<h1>JClock</h1>
			<p class="subtitle" id="subtitle"></p>

			<div class="choice-grid" id="choice-grid"></div>
		</div>
	</main>

	<section id="viewer" aria-live="polite">
		<div id="iframe-container"></div>
	</section>

<script type="text/javascript">
	(function redirectNeedMeDomain() {
		const hostname = window.location.hostname.toLowerCase().replace(/^www\./, "");
		const needMePath = "https://JClock.net/HebrewCommercial13/public/Need-Me/index.html";

		if (hostname === "need-me.net" && window.location.pathname !== needMePath) {
			window.location.replace(needMePath + window.location.search + window.location.hash);
		}
	})();

	const DEFAULT_LATITUDE = "31.7768514";
	const DEFAULT_LONGITUDE = "35.2331664";
	const locationQuery = "?latitude=" + DEFAULT_LATITUDE + "&longitude=" + DEFAULT_LONGITUDE;
	const userLanguage = (navigator.language || navigator.userLanguage || "he").toLowerCase();
	const language = userLanguage.startsWith("en") ? "en" : "he";
	const MOBILE_FRAME_WIDTH = 900;

	const text = {
		he: {
			subtitle: "בחר את היבשת או האזור שבו אתה נמצא"
		},
		en: {
			subtitle: "Choose the continent or region where you are"
		}
	};

	const sourcePaths = {
		clockFamily: "https://JClock.net/HebrewClock13/public/family/index.html",
		clockMan: "https://JClock.net/HebrewClock13/public/man/simple/index.html",
		clockWoman: "https://JClock.net/HebrewClock13/public/woman/simple/index.html",
		commercialFamily: "https://JClock.net/HebrewCommercial13/public/family/index.html",
		commercialMan: "https://JClock.net/HebrewCommercial13/public/man/index.html",
		commercialWoman: "https://JClock.net/HebrewCommercial13/public/woman/index.html",
		personalArea: "https://JClock.net/HebrewClock13/public/man/marrige/"
	};

	function buildSources(query) {
		return {
			clockFamily: sourcePaths.clockFamily + query,
			clockMan: sourcePaths.clockMan + query,
			clockWoman: sourcePaths.clockWoman + query,
			commercialFamily: sourcePaths.commercialFamily + query,
			commercialMan: sourcePaths.commercialMan + query,
			commercialWoman: sourcePaths.commercialWoman + query
		};
	}

	const sources = buildSources(locationQuery);

	const viewOptions = [
		{
			heading: {
				he: "שעון בלבד:",
				en: "Clock only:"
			}
		},
		{
			id: "sun-clock",
			label: {
				he: "שעון חמה",
				en: "Sun clock"
			},
			frames: [
				{ title: { he: "שעון חמה", en: "Sun clock" }, src: sources.clockMan }
			],
			primary: true
		},
		{
			id: "moon-clock",
			label: {
				he: "שעון לבנה",
				en: "Moon clock"
			},
			frames: [
				{ title: { he: "שעון לבנה", en: "Moon clock" }, src: sources.clockWoman }
			]
		},
		{
			id: "diaspora-clock",
			label: {
				he: "שעון חו\"ל (חמה ולבנה)",
				en: "Diaspora clock (Sun and Moon)"
			},
			frames: [
				{ title: { he: "שעון חמה - חו\"ל", en: "Sun clock - Diaspora" }, src: sources.clockMan },
				{ title: { he: "שעון לבנה - חו\"ל", en: "Moon clock - Diaspora" }, src: sources.clockWoman }
			],
			layout: "row"
		},
		{
			heading: {
				he: "פרסומת בלבד:",
				en: "Ads only:"
			}
		},
		{
			id: "sun-ads",
			label: {
				he: "פרסומות של שעון חמה",
				en: "Sun clock ads"
			},
			frames: [
				{ title: { he: "פרסומות של שעון חמה", en: "Sun clock ads" }, src: sources.commercialMan }
			]
		},
		{
			id: "moon-ads",
			label: {
				he: "פרסומות של שעון לבנה",
				en: "Moon clock ads"
			},
			frames: [
				{ title: { he: "פרסומות של שעון לבנה", en: "Moon clock ads" }, src: sources.commercialWoman }
			]
		},
		{
			id: "diaspora-ads",
			label: {
				he: "פרסומות של שעון חו\"ל (חמה ולבנה)",
				en: "Diaspora clock ads (Sun and Moon)"
			},
			frames: [
				{ title: { he: "פרסומות של שעון חו\"ל", en: "Diaspora clock ads" }, src: sources.commercialFamily }
			]
		},
		{
			heading: {
				he: "שעון + פרסומת:",
				en: "Clock + ads:"
			}
		},
		{
			id: "sun-clock-ads",
			label: {
				he: "שעון חמה + פרסומות",
				en: "Sun clock + ads"
			},
			frames: [
				{ title: { he: "פרסומות של שעון חמה", en: "Sun clock ads" }, src: sources.commercialMan },
				{ title: { he: "שעון חמה", en: "Sun clock" }, src: sources.clockMan }
			],
			layout: "clock-ads"
		},
		{
			id: "moon-clock-ads",
			label: {
				he: "שעון לבנה + פרסומות",
				en: "Moon clock + ads"
			},
			frames: [
				{ title: { he: "פרסומות של שעון לבנה", en: "Moon clock ads" }, src: sources.commercialWoman },
				{ title: { he: "שעון לבנה", en: "Moon clock" }, src: sources.clockWoman }
			],
			layout: "clock-ads"
		},
		{
			id: "diaspora-clock-ads",
			label: {
				he: "שעון חו\"ל (חמה ולבנה) + פרסומות",
				en: "Diaspora clock (Sun and Moon) + ads"
			},
			personalLabel: {
				he: "",
				en: ""
			},
			personalUrl: sourcePaths.personalArea + language + "/index.html" + locationQuery,
			frames: [
				{ title: { he: "פרסומות של שעון חו\"ל", en: "Diaspora clock ads" }, src: sources.commercialFamily },
				{ title: { he: "שעון חו\"ל (חמה ולבנה)", en: "Diaspora clock (Sun and Moon)" }, src: sources.clockFamily }
			],
			layout: "clock-ads"
		}
	];

	const choiceScreen = document.getElementById("choice-screen");
	const subtitle = document.getElementById("subtitle");
	const choiceGrid = document.getElementById("choice-grid");
	const viewer = document.getElementById("viewer");
	const iframeContainer = document.getElementById("iframe-container");
	let frameResizeObserver = null;

	function localText(value) {
		return value[language] || value.he;
	}

	function applyLanguage() {
		document.documentElement.lang = language;
		document.documentElement.dir = language === "he" ? "rtl" : "ltr";
		subtitle.textContent = text[language].subtitle;
	}

	function updateFrameScale() {
		const scale = Math.min(1, window.innerWidth / MOBILE_FRAME_WIDTH);
		document.documentElement.style.setProperty("--frame-scale", scale);
		updateSlotScales();
	}

	function updateSlotScales() {
		iframeContainer.querySelectorAll(".frame-slot").forEach(function(slot) {
			const slotWidth = slot.getBoundingClientRect().width || window.innerWidth;
			const scale = Math.min(1, slotWidth / MOBILE_FRAME_WIDTH);
			slot.classList.toggle("narrow-slot", scale < 1);
			slot.style.setProperty("--frame-scale", scale);
		});
	}

	function watchFrameSlots() {
		if (frameResizeObserver) {
			frameResizeObserver.disconnect();
			frameResizeObserver = null;
		}

		if ("ResizeObserver" in window) {
			frameResizeObserver = new ResizeObserver(updateSlotScales);
			iframeContainer.querySelectorAll(".frame-slot").forEach(function(slot) {
				frameResizeObserver.observe(slot);
			});
		}

		requestAnimationFrame(updateSlotScales);
	}

	function renderChoices() {
		viewOptions.forEach(function(option) {
			if (option.heading) {
				const heading = document.createElement("h2");
				heading.className = "choice-section-title";
				heading.textContent = localText(option.heading);
				choiceGrid.appendChild(heading);
				return;
			}

			if (option.personalUrl) {
				const split = document.createElement("div");
				const personalButton = document.createElement("button");
				const mainButton = document.createElement("button");

				split.className = "choice-split";
				split.setAttribute("role", "group");
				split.setAttribute("aria-label", localText(option.label));

				personalButton.type = "button";
				personalButton.className = "choice-button choice-personal";
				personalButton.textContent = localText(option.personalLabel);
				personalButton.dir = language === "he" ? "rtl" : "ltr";
				personalButton.onclick = function() {
					window.location.href = option.personalUrl;
				};

				mainButton.type = "button";
				mainButton.className = "choice-button choice-main";
				mainButton.textContent = localText(option.label);
				mainButton.dir = language === "he" ? "rtl" : "ltr";
				mainButton.onclick = function() {
					openView(option.id);
				};

				split.appendChild(personalButton);
				split.appendChild(mainButton);
				choiceGrid.appendChild(split);
				return;
			}

			const button = document.createElement("button");
			button.type = "button";
			button.className = "choice-button" + (option.primary ? " primary" : "");
			button.textContent = localText(option.label);
			button.onclick = function() {
				openView(option.id);
			};
			choiceGrid.appendChild(button);
		});
	}

	function openView(optionId) {
		const cleanOptionId = optionId.split("/")[0];
		const option = viewOptions.find(function(item) {
			return item.id === cleanOptionId;
		}) || viewOptions.find(function(item) {
			return item.id;
		});

		if (!option.frames) {
			choiceScreen.style.display = "";
			viewer.style.display = "none";
			window.location.hash = "";
			return;
		}

		openFrames(option.id, option.frames, option.layout);
	}

	function openFrames(optionId, frames, layout) {
		iframeContainer.innerHTML = "";
		iframeContainer.className = layout === "quad" ? "quad-layout" : (layout === "row" ? "row-layout" : (layout === "clock-ads" ? "clock-ads-layout" : ""));

		frames.forEach(function(frame) {
			const frameSlot = document.createElement("div");
			const iframe = document.createElement("iframe");
			frameSlot.className = "frame-slot";
			iframe.className = "display-frame";
			iframe.title = localText(frame.title);
			iframe.src = frame.src;
			iframe.tabIndex = 0;
			iframe.setAttribute("scrolling", "auto");
			iframe.addEventListener("mouseenter", function() {
				iframe.focus();
			});
			iframe.addEventListener("click", function() {
				iframe.focus();
			});
			frameSlot.appendChild(iframe);
			iframeContainer.appendChild(frameSlot);
		});

		choiceScreen.style.display = "none";
		viewer.style.display = "flex";
		window.location.hash = optionId + "/" + frames.map(function(frame) {
			return frame.src;
		}).join("|");
		watchFrameSlots();
	}

	applyLanguage();
	updateFrameScale();
	renderChoices();
	window.addEventListener("resize", updateFrameScale);

	if (window.location.hash.length > 1) {
		openView(window.location.hash.substring(1));
	}
</script>
</body>
</html>
