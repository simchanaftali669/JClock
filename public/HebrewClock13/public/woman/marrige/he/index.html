<!DOCTYPE html>
<html lang="en">
<head>
  <title>משמעות הנישואים</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.rtlcss.com/bootstrap/v4.2.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
  <script>
    document.write('<script src="https://bind-me.net/MarrigeDB.js?v=' + Date.now() + '"><\/script>');
  </script>
</head>
<body>

<div class="container mt-3">
  <!-- Button to Open the Modal -->
<center>
	<button id="btn" type="button" class="btn btn-primary" data-toggle="modal" data-target="#myModal">
        לימוד אישי
  	</button>
</center>


    <!-- Change date Modal -->
    <div class="modal fade" id="myModal">
        <div class="modal-dialog">
        <div class="modal-content">
        
            <!-- Modal Header -->
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">×</button>
                <h4 class="modal-title">לימוד אישי</h4>
            </div>
            
            <!-- Modal body -->
            <div class="modal-body" style="direction:rtl;!important;">
                 <p style="display: inline-block; width: 248px;">הכנס שם מלא:</p><input type="text" value="נפתלי ביליג" id="ID" list="marrigeNames" autocomplete="off" />
                 <datalist id="marrigeNames"></datalist>
                 <div style="margin-top:12px;">
                    <p style="margin-bottom:6px;">בחר מועד מפגש:</p>
                    <label style="display:block;">
                        <input type="radio" name="birthClock" value="moon" checked />
                        מועד הלבנה - מניע אותי ומעניק לי בית
                    </label>
                    <label style="display:block;">
                        <input type="radio" name="birthClock" value="sun" />
                        מועד החמה - מעניק לי כיוון
                    </label>
                 </div>
                 <label style="display:block; margin-top:12px;">
                    <input type="checkbox" id="saveDefaultID" />
                    שמור כברירת מחדל
                 </label>
            </div>
            
            <!-- Modal footer -->
            <div class="modal-footer">
            <button type="button" class="btn btn-danger" data-dismiss="modal" onclick="get_marrige_essential();">אישור</button>
            </div>
            
        </div>
        </div>
    </div>
  
</div>

<script>
    var defaultIdStorageKey = "jclock-personal-learning-default-id";
    var defaultClockStorageKey = "jclock-personal-learning-default-clock";

    function loadDefaultID()
    {
        var savedID = localStorage.getItem(defaultIdStorageKey);
        if(savedID)
            document.getElementById("ID").value = savedID;

        var savedClock = localStorage.getItem(defaultClockStorageKey);
        var clockInput = document.querySelector('input[name="birthClock"][value="' + savedClock + '"]');
        if(clockInput)
            clockInput.checked = true;
    }

    function getSelectedBirthClock()
    {
        var checkedClock = document.querySelector('input[name="birthClock"]:checked');
        return checkedClock ? checkedClock.value : "moon";
    }

    function saveDefaultIDIfNeeded()
    {
        if(document.getElementById("saveDefaultID").checked)
        {
            localStorage.setItem(defaultIdStorageKey, document.getElementById("ID").value.trim());
            localStorage.setItem(defaultClockStorageKey, getSelectedBirthClock());
        }
    }

    function populateMarrigeNameOptions()
    {
        if(!Array.isArray(window.marrigeDB))
            return;

        var names = [];
        window.marrigeDB.forEach(function(record) {
            if(record && record.ID && names.indexOf(record.ID) === -1)
                names.push(record.ID);
        });

        names.sort(function(a, b) {
            return a.localeCompare(b, "he");
        });

        var list = document.getElementById("marrigeNames");
        list.innerHTML = "";
        names.forEach(function(name) {
            var option = document.createElement("option");
            option.value = name;
            list.appendChild(option);
        });
    }

    function findMarrigeTimeByID(id)
    {
        var cleanId = (id || "").trim();
        return window.marrigeDB.find(function(marrigeTime) {
            return (marrigeTime.ID || "").trim() == cleanId;
        }) || window.marrigeDB.find(function(marrigeTime) {
            return (marrigeTime.ID || "").trim().toLowerCase() == cleanId.toLowerCase();
        });
    }

    function getMarrigeTimeForSelectedClock(marrigeTime)
    {
        var selectedClock = getSelectedBirthClock();
        return {
            hebrewDay: marrigeTime.hebrewDay,
            hebrewHour: selectedClock == "sun" && marrigeTime.mazalHour != null ? marrigeTime.mazalHour : marrigeTime.hebrewHour
        };
    }

	async function get_marrige_essential()
	{
        var url_obj = new URL(document.location.href);
        var lon = url_obj.searchParams.get("longitude");
        var lat = url_obj.searchParams.get("latitude");
        var location = "";
        if(lon)
            location = "&longitude=" + lon + "&latitude=" + lat;

        if(!Array.isArray(window.marrigeDB))
        {
            alert("Could not load the marriage database.");
            return;
        }

        saveDefaultIDIfNeeded();
        var marrigeTime = findMarrigeTimeByID(document.getElementById("ID").value);
        if(marrigeTime != null)
        {
            marrigeTime = getMarrigeTimeForSelectedClock(marrigeTime);
            document.location.href = "https://JClock.net/HebrewClock13/public/woman/me/he/index.html?hebrewDay=" + marrigeTime.hebrewDay + "&hebrewHour=" + marrigeTime.hebrewHour + "&period=personal" + location;
        }
        else
        {
            alert("תעודת הזהות לא קיימת במערכת");
            //document.location.href = "https://JClock.net/HebrewClock13/public/woman/me/he/index.html"; 
        } 
    }
	$(document).ready(function()
	{
        loadDefaultID();
        populateMarrigeNameOptions();
		$('[data-toggle="tooltip"]').tooltip();   
	});</script>

</body>
</html>
