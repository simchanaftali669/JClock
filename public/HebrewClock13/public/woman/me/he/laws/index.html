<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <title>חוקים לפי שעה עברית</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            background: #f7f7f7;
            color: #111;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 980px;
            margin: 0 auto;
            padding: 24px 16px 40px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 44px;
            text-align: center;
        }

        #lawsMeta {
            margin-bottom: 24px;
            font-size: 24px;
            text-align: center;
        }

        .law-card {
            margin-bottom: 12px;
            padding: 16px;
            border: 1px solid #d7d7d7;
            border-radius: 6px;
            background: #fff;
        }

        .law-card h2 {
            margin: 0 0 10px;
            font-size: 24px;
            line-height: 1.35;
        }

        .law-details {
            margin-bottom: 10px;
            color: #444;
            font-size: 18px;
        }

        .law-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .law-card a {
            display: inline-block;
            padding: 8px 14px;
            border: 1px solid #0057b8;
            border-radius: 6px;
            background: #0057b8;
            color: #fff;
            font-size: 18px;
            text-decoration: none;
        }

        .law-card a:hover {
            background: #003f86;
        }

        .law-empty {
            padding: 28px;
            border: 1px solid #d7d7d7;
            border-radius: 6px;
            background: #fff;
            font-size: 24px;
            text-align: center;
        }
    </style>
</head>
<body>
    <main>
        <h1 id="lawsTitle">חוקים</h1>
        <div id="lawsMeta"></div>
        <section id="lawsList"></section>
    </main>

    <script type="text/javascript" src="../js/LawsData.js"></script>
    <script type="text/javascript" src="../js/Laws.js"></script>
    <script type="text/javascript">
        renderLawsPage();
    </script>
</body>
</html>
