	function getClockQueryString(url)
	{
		var date = new Date();
		var hour = birthHour == null ? date.getHours() : birthHour;
		var min = birthMin == null ? date.getMinutes() : birthMin;
		var sec = birthSec == null ? date.getSeconds() : birthSec;
		var ms = birthMs == null ? date.getMilliseconds() : birthMs;
		var year = birthYear == null ? date.getFullYear() : birthYear;
		var month = birthMonth == null ? date.getMonth() + 1 : birthMonth;
		var day = birthDay == null ? date.getDate() : birthDay;
		var gmt = birthGMT == null ? (new Date().getTimezoneOffset() / -60) : birthGMT;
		var params = new URLSearchParams(url.search);
		if(!params.get("latitude"))
			params.set("latitude", latitude);
		if(!params.get("longitude"))
			params.set("longitude", longitude);
		if(!params.get("hour"))
			params.set("hour", hour);
		if(!params.get("min"))
			params.set("min", min);
		if(!params.get("sec"))
			params.set("sec", sec);
		if(!params.get("ms"))
			params.set("ms", ms);
		if(!params.get("year"))
			params.set("year", year);
		if(!params.get("month"))
			params.set("month", month);
		if(!params.get("day"))
			params.set("day", day);
		if(!params.get("gmt"))
			params.set("gmt", gmt);
		params.set("live", "1");
		params.set("liveStart", Date.now());
		return "?" + params.toString();
	}
