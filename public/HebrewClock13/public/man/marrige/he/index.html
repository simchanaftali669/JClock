<!DOCTYPE html>
<html lang="en">
<head>
  <title>משמעות הנישואים</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.rtlcss.com/bootstrap/v4.2.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
  <script>
    document.write('<script src="https://bind-me.net/MarrigeDB.js?v=' + Date.now() + '"><\/script>');
  </script>
</head>
<body>

<div class="container mt-3">
  <!-- Button to Open the Modal -->
<center>
	<button id="btn" type="button" class="btn btn-primary" data-toggle="modal" data-target="#myModal">
        לימוד אישי
  	</button>
</center>


    <!-- Change date Modal -->
    <div class="modal fade" id="myModal">
        <div class="modal-dialog">
        <div class="modal-content">
        
            <!-- Modal Header -->
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">×</button>
                <h4 class="modal-title">לימוד אישי</h4>
            </div>
            
            <!-- Modal body -->
            <div class="modal-body" style="direction:rtl;!important;">
                 <p style="display: inline-block; width: 248px;">הכנס שם מלא:</p><input type="text" value="נפתלי ביליג" id="ID" list="marrigeNames" autocomplete="off" />
                 <datalist id="marrigeNames"></datalist>
                 <div style="margin-top:12px;">
                    <p style="margin-bottom:6px;">בחר מועד מפגש:</p>
                    <label style="display:block;">
                        <input type="radio" name="birthClock" value="moon" checked />
                        מועד הלבנה - מניע אותי ומעניק לי בית
                    </label>
                    <label style="display:block;">
                        <input type="radio" name="birthClock" value="sun" />
                        מועד החמה - מעניק לי כיוון
                    </label>
                    <label style="display:block;">
                        <input type="radio" name="birthClock" value="both" />
                        משולב - חמה ולבנה
                    </label>
                 </div>
                 <label style="display:block; margin-top:12px;">
                    <input type="checkbox" id="saveDefaultID" />
                    שמור כברירת מחדל
                 </label>
            </div>
            
            <!-- Modal footer -->
            <div class="modal-footer">
            <button type="button" class="btn btn-danger" data-dismiss="modal" onclick="get_marrige_essential();">אישור</button>
            </div>
            
        </div>
        </div>
    </div>
  
</div>

<script>
    var defaultIdStorageKey = "jclock-personal-learning-default-id";
    var defaultClockStorageKey = "jclock-personal-learning-default-clock";

    function loadDefaultID()
    {
        var savedID = localStorage.getItem(defaultIdStorageKey);
        if(savedID)
        {
            document.getElementById("ID").value = savedID;
        }

        var savedClock = localStorage.getItem(defaultClockStorageKey);
        var clockInput = document.querySelector('input[name="birthClock"][value="' + savedClock + '"]');
        if(clockInput)
        {
            clockInput.checked = true;
        }
    }

    function saveDefaultIDIfNeeded()
    {
        var idInput = document.getElementById("ID");
        var saveDefault = document.getElementById("saveDefaultID").checked;
        if(saveDefault)
        {
            localStorage.setItem(defaultIdStorageKey, idInput.value.trim());
            localStorage.setItem(defaultClockStorageKey, getSelectedBirthClock());
        }
    }

    function populateMarrigeNameOptions()
    {
        if(!Array.isArray(window.marrigeDB))
            return;

        var names = [];
        window.marrigeDB.forEach(function(record) {
            if(record && record.ID && names.indexOf(record.ID) === -1)
                names.push(record.ID);
        });

        names.sort(function(a, b) {
            return a.localeCompare(b, "he");
        });

        var list = document.getElementById("marrigeNames");
        list.innerHTML = "";
        names.forEach(function(name) {
            var option = document.createElement("option");
            option.value = name;
            list.appendChild(option);
        });
    }

    function findMarrigeTimeByID(id)
    {
        var cleanId = (id || "").trim();
        return window.marrigeDB.find(function(marrigeTime) {
            return (marrigeTime.ID || "").trim() == cleanId;
        }) || window.marrigeDB.find(function(marrigeTime) {
            return (marrigeTime.ID || "").trim().toLowerCase() == cleanId.toLowerCase();
        });
    }

    function getSelectedBirthClock()
    {
        var checkedClock = document.querySelector('input[name="birthClock"]:checked');
        return checkedClock ? checkedClock.value : "moon";
    }

    function isHebrewText(value)
    {
        return /[\u0590-\u05FF]/.test(value || "");
    }

    function getClockValue(record, clock, suffix)
    {
        var prefixes = clock == "sun" ? ["sun", "solar", "chama"] : ["moon", "lunar", "levana"];
        for(var i = 0; i < prefixes.length; i++)
        {
            var key = prefixes[i] + suffix;
            if(record[key] != null)
                return record[key];
        }

        return null;
    }

    function getExplicitClockType(record)
    {
        return (record.clockType || record.birthClock || record.mazalType || record.type || "").toString().toLowerCase();
    }

    function isClockType(record, clock)
    {
        var clockType = getExplicitClockType(record);
        if(clock == "sun")
            return clockType == "sun" || clockType == "solar" || clockType == "chama";

        return clockType == "moon" || clockType == "lunar" || clockType == "levana";
    }

    function getMarrigeTimeForSelectedClock(marrigeTime)
    {
        var clock = getSelectedBirthClock();
        if(clock == "both")
            clock = "moon";

        return getMarrigeTimeForClock(marrigeTime, clock);
    }

    function getMarrigeTimeForClock(marrigeTime, clock)
    {
        var day = getClockValue(marrigeTime, clock, "HebrewDay");
        var hour = getClockValue(marrigeTime, clock, "HebrewHour");
        if(day != null && hour != null)
            return { hebrewDay: day, hebrewHour: hour };

        if(isClockType(marrigeTime, clock))
            return marrigeTime;

        var currentIndex = window.marrigeDB.indexOf(marrigeTime);
        var adjacentTimes = [window.marrigeDB[currentIndex - 1], window.marrigeDB[currentIndex + 1]];
        var adjacentMatch = adjacentTimes.find(function(candidate) {
            if(!candidate || candidate.phoneNumber == null || candidate.phoneNumber != marrigeTime.phoneNumber)
                return false;

            var candidateIsHebrew = isHebrewText(candidate.ID);
            return clock == "sun" ? candidateIsHebrew : !candidateIsHebrew;
        });
        if(adjacentMatch)
            return adjacentMatch;

        var samePersonTimes = window.marrigeDB.filter(function(candidate) {
            return candidate.phoneNumber != null && candidate.phoneNumber == marrigeTime.phoneNumber;
        });
        var explicitMatch = samePersonTimes.find(function(candidate) {
            return isClockType(candidate, clock);
        });
        if(explicitMatch)
            return explicitMatch;

        var pairedMatch = samePersonTimes.find(function(candidate) {
            var candidateIsHebrew = isHebrewText(candidate.ID);
            return clock == "sun" ? candidateIsHebrew : !candidateIsHebrew;
        });
        return pairedMatch || marrigeTime;
    }

    function getCombinedClockParams(marrigeTime)
    {
        var moonTime = getMarrigeTimeForClock(marrigeTime, "moon");
        var sunTime = getMarrigeTimeForClock(marrigeTime, "sun");
        return "&clock=both" +
            "&moonHebrewDay=" + moonTime.hebrewDay +
            "&moonHebrewHour=" + moonTime.hebrewHour +
            "&sunHebrewDay=" + sunTime.hebrewDay +
            "&sunHebrewHour=" + sunTime.hebrewHour;
    }

 	async function get_marrige_essential()
 	{
		var url_obj = new URL(document.location.href);
		var lon = url_obj.searchParams.get("longitude");        
		var lat = url_obj.searchParams.get("latitude");
	
		var location = "";
		if(lon)
			location = "&longitude=" + lon + "&latitude=" + lat; 
	
        if(!Array.isArray(window.marrigeDB))
        {
            alert("Could not load the marriage database.");
            return;
        }

        saveDefaultIDIfNeeded();
        var marrigeTime = findMarrigeTimeByID(document.getElementById("ID").value);
        if(marrigeTime != null)
        {
            var selectedClock = getSelectedBirthClock();
            var combinedParams = "";
            if(selectedClock == "both")
                combinedParams = getCombinedClockParams(marrigeTime);

            if(selectedClock == "both")
            {
                document.location.href = "https://JClock.net/HebrewClock13/public/family/index.html?period=personal&lang=he" + combinedParams + location;
                return;
            }

            marrigeTime = getMarrigeTimeForSelectedClock(marrigeTime);
            document.location.href = "https://JClock.net/HebrewClock13/public/man/me/he/index.html?hebrewDay=" + marrigeTime.hebrewDay + "&hebrewHour=" + marrigeTime.hebrewHour + "&period=personal" + location; 
        }
        else
        {
            alert("תעודת הזהות לא קיימת במערכת");
			document.location.href='https://birthcalculator.web.app/';
            //document.location.href = "https://JClock.net/HebrewClock13/public/man/me/he/index.html"; 
        } 
    }
 	$(document).ready(function()
 	{
        loadDefaultID();
        populateMarrigeNameOptions();
 		$('[data-toggle="tooltip"]').tooltip();   
 	});</script>

</body>
</html>
