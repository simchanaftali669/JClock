<!DOCTYPE html>
<html lang="en">
<head>
  <title>Marrige essennce</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>
    (function hardRefreshOnReload() {
      var navigationEntry = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
      var isReload = (navigationEntry && navigationEntry.type == "reload") ||
        (performance.navigation && performance.navigation.type === performance.navigation.TYPE_RELOAD);
      if(isReload)
      {
        var url = new URL(window.location.href);
        url.searchParams.set("hardRefresh", Date.now().toString());
        window.location.replace(url.toString());
      }
    })();
  </script>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js"></script>
  <script>
    document.write('<script src="https://bind-me.net/MarrigeDB.js?v=' + Date.now() + '"><\/script>');
  </script>
</head>
<body >

<div class="container mt-3">
  <!-- Button to Open the Modal -->
<center>
	<button id="btn" type="button" class="btn btn-primary" data-toggle="modal" data-target="#myModal">
			Self Learing
	</button>
</center>


    <!-- Change date Modal -->
    <div class="modal fade" id="myModal">
        <div class="modal-dialog">
        <div class="modal-content">
        
            <!-- Modal Header -->
            <div class="modal-header">
              <button type="button" class="close" data-dismiss="modal">×</button>
              <h4 class="modal-title">Self Learing</h4>
          </div>
          
          <!-- Modal body -->
          <div class="modal-body">
               <p style="display: inline-block; width: 248px;">Enter full name:</p><input type="text" value="Naftali Bilig" id="ID" list="marrigeNames" autocomplete="off" />
               <datalist id="marrigeNames"></datalist>
               <div style="margin-top:12px;">
                  <p style="margin-bottom:6px;">Choose meeting molad:</p>
                  <label style="display:block;">
                      <input type="radio" name="birthClock" value="sun" checked />
                      Sun molad - What should I give? What is my goal in life?
                  </label>
                  <label style="display:block;">
                      <input type="radio" name="birthClock" value="moon" />
                      Moon molad - What am I entitled to receive? What motivates me in life?
                  </label>
                  <!--
                  <label style="display:block;">
                      <input type="radio" name="birthClock" value="both" />
                      Combined - sun and moon
                  </label>
                  -->
               </div>
               <label style="display:block; margin-top:12px;">
                  <input type="checkbox" id="saveDefaultID" />
                  Save as default
               </label>
          </div>
          
          <!-- Modal footer -->
          <div class="modal-footer">
              <button type="button" class="btn btn-danger" data-dismiss="modal" onclick="get_marrige_essential();">Ok</button>
          </div>
            
        </div>
        </div>
    </div>
  
</div>

<script>
    var defaultIdStorageKey = "jclock-personal-learning-default-id";
    var defaultClockStorageKey = "jclock-personal-learning-default-man-clock";

    function loadDefaultID()
    {
        var savedID = localStorage.getItem(defaultIdStorageKey);
        if(savedID)
        {
            document.getElementById("ID").value = savedID;
        }

        var savedClock = localStorage.getItem(defaultClockStorageKey);
        var clockInput = document.querySelector('input[name="birthClock"][value="' + savedClock + '"]');
        if(clockInput)
        {
            clockInput.checked = true;
        }
    }

    function saveDefaultIDIfNeeded()
    {
        var idInput = document.getElementById("ID");
        var saveDefault = document.getElementById("saveDefaultID").checked;
        if(saveDefault)
        {
            localStorage.setItem(defaultIdStorageKey, idInput.value.trim());
            localStorage.setItem(defaultClockStorageKey, getSelectedBirthClock());
        }
    }

    function populateMarrigeNameOptions()
    {
        if(!Array.isArray(window.marrigeDB))
            return;

        var names = [];
        var seenNames = {};
        window.marrigeDB.forEach(function(record) {
            var normalizedName = normalizeMarrigeName(record && record.ID);
            if(record && record.ID && !seenNames[normalizedName])
            {
                seenNames[normalizedName] = true;
                names.push(record.ID);
            }
        });

        names.sort(function(a, b) {
            return a.localeCompare(b, "en");
        });

        var list = document.getElementById("marrigeNames");
        list.innerHTML = "";
        names.forEach(function(name) {
            var option = document.createElement("option");
            option.value = name;
            list.appendChild(option);
        });
    }

    function normalizeMarrigeName(name)
    {
        return (name || "").trim().replace(/\s+/g, " ").toLowerCase();
    }

    function findMarrigeTimesByID(id)
    {
        var cleanId = normalizeMarrigeName(id);
        return window.marrigeDB.filter(function(marrigeTime) {
            return normalizeMarrigeName(marrigeTime.ID) == cleanId;
        });
    }

    function getSelectedBirthClock()
    {
        var checkedClock = document.querySelector('input[name="birthClock"]:checked');
        return checkedClock ? checkedClock.value : "sun";
    }

    function isHebrewText(value)
    {
        return /[\u0590-\u05FF]/.test(value || "");
    }

    function parseBooleanClockValue(value)
    {
        if(value === true || value === "true" || value === 1 || value === "1")
            return true;

        if(value === false || value === "false" || value === 0 || value === "0")
            return false;

        return null;
    }

    function getClockValue(record, clock, suffix, allowGenericFallback)
    {
        var prefixes = clock == "sun" ? ["sun", "solar", "chama"] : ["moon", "lunar", "levana"];
        for(var i = 0; i < prefixes.length; i++)
        {
            var key = prefixes[i] + suffix;
            if(record[key] != null)
                return record[key];
        }

        if(!allowGenericFallback)
            return null;

        if(suffix == "HebrewDay" && record.hebrewDay != null)
            return record.hebrewDay;

        if(suffix == "HebrewHour")
        {
            if(record.hebrewHour != null)
                return record.hebrewHour;
        }

        return null;
    }

    function getExplicitClockType(record)
    {
        return (record.clockType || record.birthClock || record.mazalType || record.type || "").toString().toLowerCase();
    }

    function isClockType(record, clock)
    {
        var isMoon = parseBooleanClockValue(record.isMoon);
        if(isMoon !== null)
            return clock == "moon" ? isMoon : !isMoon;

        var clockType = getExplicitClockType(record);
        if(clock == "sun")
            return clockType == "sun" || clockType == "solar" || clockType == "chama";

        return clockType == "moon" || clockType == "lunar" || clockType == "levana";
    }

    function getMarrigeTimeForSelectedClock(marrigeTime)
    {
        var clock = getSelectedBirthClock();
        if(clock == "both")
            clock = "moon";

        return getMarrigeTimeForClock(marrigeTime, clock);
    }

    function getMarrigeTimeForClock(marrigeTime, clock)
    {
        var records = Array.isArray(marrigeTime) ? marrigeTime : [marrigeTime];
        var explicitRecord = records.find(function(record) {
            return record && isClockType(record, clock);
        });
        var selectedRecord = explicitRecord || records.find(function(record) {
            return record && getClockValue(record, clock, "HebrewDay", false) != null && getClockValue(record, clock, "HebrewHour", false) != null;
        }) || records[0];

        var day = getClockValue(selectedRecord, clock, "HebrewDay", true);
        var hour = getClockValue(selectedRecord, clock, "HebrewHour", true);
        if(day != null && hour != null)
            return { hebrewDay: day, hebrewHour: hour };

        if(selectedRecord && isClockType(selectedRecord, clock))
            return selectedRecord;

        var currentIndex = window.marrigeDB.indexOf(selectedRecord);
        var adjacentTimes = [window.marrigeDB[currentIndex - 1], window.marrigeDB[currentIndex + 1]];
        var adjacentMatch = adjacentTimes.find(function(candidate) {
            if(!candidate || candidate.phoneNumber == null || candidate.phoneNumber != selectedRecord.phoneNumber)
                return false;

            return isClockType(candidate, clock);
        });
        if(adjacentMatch)
            return adjacentMatch;

        var samePersonTimes = window.marrigeDB.filter(function(candidate) {
            return candidate.phoneNumber != null && candidate.phoneNumber == selectedRecord.phoneNumber;
        });
        var explicitMatch = samePersonTimes.find(function(candidate) {
            return isClockType(candidate, clock);
        });
        if(explicitMatch)
            return explicitMatch;

        var pairedMatch = samePersonTimes.find(function(candidate) {
            var candidateIsHebrew = isHebrewText(candidate.ID);
            return clock == "sun" ? candidateIsHebrew : !candidateIsHebrew;
        });
        return pairedMatch || selectedRecord;
    }

    function getCombinedClockParams(marrigeTime)
    {
        var moonTime = getMarrigeTimeForClock(marrigeTime, "moon");
        var sunTime = getMarrigeTimeForClock(marrigeTime, "sun");
        return "&clock=both" +
            "&moonHebrewDay=" + moonTime.hebrewDay +
            "&moonHebrewHour=" + moonTime.hebrewHour +
            "&sunHebrewDay=" + sunTime.hebrewDay +
            "&sunHebrewHour=" + sunTime.hebrewHour;
    }

 	async function get_marrige_essential()
 	{
		var url_obj = new URL(document.location.href);
		var lon = url_obj.searchParams.get("longitude");        
		var lat = url_obj.searchParams.get("latitude");
	
		var location = "";
		if(lon)
			location = "&longitude=" + lon + "&latitude=" + lat; 
	
		if(!Array.isArray(window.marrigeDB))
		{
			alert("Could not load the marriage database.");
			return;
		}

		saveDefaultIDIfNeeded();
		var marrigeTimes = findMarrigeTimesByID(document.getElementById("ID").value);
		if(marrigeTimes.length > 0)
		{
		  var selectedClock = getSelectedBirthClock();
		  var combinedParams = "";
		  if(selectedClock == "both")
			combinedParams = getCombinedClockParams(marrigeTimes);

		  if(selectedClock == "both")
		  {
			document.location.href = "https://JClock.net/HebrewClock13/public/family/index.html?period=personal&lang=en" + combinedParams + location;
			return;
		  }

		  var marrigeTime = getMarrigeTimeForSelectedClock(marrigeTimes);
		  document.location.href = "https://JClock.net/HebrewClock13/public/man/me/en/index.html?hebrewDay=" + marrigeTime.hebrewDay + "&hebrewHour=" + marrigeTime.hebrewHour + "&period=personal" + location;  
		}
		else
		{  
		  alert("The ID doesn't exist in the database");
		  document.location.href='https://birthcalculator.web.app/';
		  //document.location.href = "https://JClock.net/HebrewClock13/public/man/me/en/index.html";  
		}
	  }
 	$(document).ready(function()
 	{
		loadDefaultID();
		populateMarrigeNameOptions();
 		$('[data-toggle="tooltip"]').tooltip();   
 	});</script>

</body>
</html>
