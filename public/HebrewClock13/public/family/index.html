    <title>Hebrew Commercial</title>

<body>
	
	<div id="iframe-container">
		<iframe id="commercial_woman" src="https://JClock.net/HebrewClock13/public/woman/simple/index.html?latitude=31.7768514&longitude=35.2331664"> </iframe>
		<div id="family_actions">
			<button 
				class="btn btn-lg rounded-pill shadow" 
				onclick="updateLocation()" 
				id="current_location">
			</button>
			<button
				class="btn btn-lg rounded-pill shadow"
				onclick="openMarrigeLearning()"
				id="marrige_learning">
			</button>
		</div>
		<iframe id="commercial_man" src="https://JClock.net/HebrewClock13/public/man/simple/index.html?latitude=31.7768514&longitude=35.2331664"> </iframe>
	</div>

	
<script type="text/javascript">

	//return;
	let userLang = navigator.language || navigator.userLanguage; 
	if (userLang.includes("he")) 
	{
		document.getElementById("current_location").innerText  = "מיקום נוכחי";
		document.getElementById("marrige_learning").innerText  = "אפשרות שלישית";
	}
	else
	{
		document.getElementById("current_location").innerText  = "current location";		
		document.getElementById("marrige_learning").innerText  = "third option";
	}

	var clockBaseUrl = "https://JClock.net/HebrewClock13/public/";
	var defaultLatitude = "31.7768514";
	var defaultLongitude = "35.2331664";
	var familyClockParams = getFamilyClockParams();
	updateFamilyActionsVisibility();
	loadFamilyClocks();

	function getFamilyClockParams()
	{
		var url = new URL(document.location.href);
		var params = new URLSearchParams(url.search);
		var date = new Date();

		if(!params.get("latitude"))
			params.set("latitude", defaultLatitude);
		if(!params.get("longitude"))
			params.set("longitude", defaultLongitude);
		if(!params.get("hour"))
			params.set("hour", date.getHours());
		if(!params.get("min"))
			params.set("min", date.getMinutes());
		if(!params.get("sec"))
			params.set("sec", date.getSeconds());
		if(!params.get("ms"))
			params.set("ms", date.getMilliseconds());
		if(!params.get("year"))
			params.set("year", date.getFullYear());
		if(!params.get("month"))
			params.set("month", date.getMonth() + 1);
		if(!params.get("day"))
			params.set("day", date.getDate());
		if(!params.get("gmt"))
			params.set("gmt", new Date().getTimezoneOffset() / -60);

		return params;
	}

	function getFamilyClockQuery()
	{
		return "?" + familyClockParams.toString();
	}

	function loadFamilyClocks()
	{
		var clockQuery = getFamilyClockQuery();
		if(isCombinedPersonalClock())
		{
			document.getElementById("commercial_woman").src = getPersonalClockUrl("woman", "moon");
			document.getElementById("commercial_man").src = getPersonalClockUrl("man", "sun");
			return;
		}

		document.getElementById("commercial_woman").src = clockBaseUrl + "woman/simple/index.html" + clockQuery;
		document.getElementById("commercial_man").src = clockBaseUrl + "man/simple/index.html" + clockQuery;
	}

	function updateFamilyActionsVisibility()
	{
		if(isCombinedPersonalClock())
			document.getElementById("family_actions").style.display = "none";
	}

	function isCombinedPersonalClock()
	{
		return familyClockParams.get("clock") == "both" &&
			familyClockParams.get("moonHebrewDay") &&
			familyClockParams.get("moonHebrewHour") &&
			familyClockParams.get("sunHebrewDay") &&
			familyClockParams.get("sunHebrewHour");
	}

	function getPersonalClockUrl(gender, clock)
	{
		var lang = familyClockParams.get("lang") || ((navigator.language || navigator.userLanguage).includes("he") ? "he" : "en");
		var params = new URLSearchParams();
		params.set("hebrewDay", familyClockParams.get(clock + "HebrewDay"));
		params.set("hebrewHour", familyClockParams.get(clock + "HebrewHour"));
		params.set("period", "personal");

		if(familyClockParams.get("latitude"))
			params.set("latitude", familyClockParams.get("latitude"));
		if(familyClockParams.get("longitude"))
			params.set("longitude", familyClockParams.get("longitude"));

		return clockBaseUrl + gender + "/me/" + lang + "/index.html?" + params.toString();
	}
	
	function updateLocation() 
	{
		if (navigator.geolocation) 
		{
			navigator.geolocation.getCurrentPosition(function(position) 
			{
				var newLat = position.coords.latitude;
				var newLng = position.coords.longitude;

				var womanIframe = document.getElementById("commercial_woman");
				var manIframe = document.getElementById("commercial_man");

				familyClockParams.set("latitude", newLat);
				familyClockParams.set("longitude", newLng);

				if(isCombinedPersonalClock())
				{
					womanIframe.src = getPersonalClockUrl("woman", "moon");
					manIframe.src = getPersonalClockUrl("man", "sun");
				}
				else
				{
					var clockQuery = getFamilyClockQuery();
					womanIframe.src = clockBaseUrl + "woman/simple/index.html" + clockQuery;
					manIframe.src = clockBaseUrl + "man/simple/index.html" + clockQuery;
				}
				
			}, function(error) {
				alert("שגיאה בקבלת מיקום: " + error.message);
			});
		} 
		else 
		{
			alert("הדפדפן לא תומך ב-GPS");
		}
	}

	function openMarrigeLearning()
	{
		window.location.href = clockBaseUrl + "man/marrige/en/index.html" + getFamilyClockQuery();
	}
	

    //public variables
    var longitude, latitude;  //current geo location
    var latd = -1, latm = 0;  // lat on earth
    var lngd = -1, lngm = 0;  // long on earth
    var lat = 0, lng = 0;     // sun's location

    var ns,ew;              // hemisphere
    var dst; 	            // daylight saving time
    var ampm = false; 	    // am/pm or 24 hour display

    var monCount = [13, 1, 32, 60, 91, 121, 152, 182, 213, 244, 274, 305, 335, 366];
    var flag = false;

    var sunsetH;
    var sunsetM;
    var sunsetS;

    var tz = (new Date().getTimezoneOffset() / -60); //current time zone

    var month, day, year;       //curren date

    var shaa_zmanit_night = 1;
    var shaa_zmanit_day = 1;

	var milisec_shaa_zmanit_night = 1000;
    var milisec_shaa_zmanit_day = 1000;
	
    var oTimer;                 //event for the running clock

    var hebrewday;
    var lbHour = 23;           //hour of the clock called also sha'a
    var lbHourClock;            //hour for displaying
    var lbMinute = 1075;       //minute of the clock called also chelek
    var lbSecond = 70;         //second of the clock called also re'ga
    var audio;
    var omer;
    var mazal_url;

	var isShowBackground = false;

	const genders = {
        MARRIED: '10',
        FEMALE: '01',
        MALE: '00'        
    }
    
    var gender;
    if( localStorage["gender"] != null )
        gender = localStorage["gender"];
    else
        gender = genders.MARRIED;


    //link to mazal information
    function openInNewTab() {
        var win = window.open(mazal_url, '_blank');
        win.focus();
    }

    //pause the background music
    function pause() {
        audio.pause();
    }

    //kidush hachodesh on specific hour
    function stop() {
		clearInterval(oTimer);

		localStorage.setItem("hebrewday", hebrewday);
		localStorage.setItem("lbHourClock", lbHourClock);
		localStorage.setItem("lbHour", lbHour);
		localStorage.setItem("lbMinute", lbMinute);
		localStorage.setItem("lbSecond", lbSecond);
        localStorage.setItem("omer", omer);
        
        //localStorage.setItem("mida", document.getElementById("Mazal").value);

        var win = window.open("https://JClock.net/HebrewClock13/public/moon.html", '_blank');
        win.focus();
    }

	function showBackground()
	{
		if(isShowBackground == false) 
		{
		console.log(isShowBackground);
			document.getElementById("thecss").href = "https://JClock.net/HebrewClock13/public/family/css/stylesheetBackground.css";
			isShowBackground = true;	
		} 
		else 
		{
		console.log(isShowBackground);
			document.getElementById("thecss").href = "https://JClock.net/HebrewClock13/public/family/css/stylesheet.css";
			isShowBackground = false;
		}
	}

    </script>
